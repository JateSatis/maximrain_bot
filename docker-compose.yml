services:
  backend:
    build:
      context: ./backend
      dockerfile: .Dockerfile
    ports:
      - "4000:4000" # Map host port 4000 to container port 4000
    environment:
      - NODE_ENV=development
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: .Dockerfile
    ports:
      - "3000:80" # Map host port 3000 to container port 80 (NGINX default)
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
